<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Rate DriveDrill</title>
<meta name="description" content="Install DriveDrill, then rate it.">
<link rel="canonical" href="https://drivedrill.app/rate/">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#DCEBFA">
<link rel="stylesheet" href="/style.css">
<style>
  /* 2026-11-11 (owner: "a hidden webpage that has a QR code that does all these steps"): not linked from any page,
     not in the sitemap, noindex. Reached only by its QR code. */
  .rate { max-width: 28rem; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 14px; text-align: center; }
  .rate img.app { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); }
  .rate h1 { margin: 0; font: 700 1.9rem/1.2 var(--display); }
  .rate .btn { display: block; padding: 18px 20px; border-radius: 18px; font-weight: 700; font-size: 1.15rem; text-decoration: none; }
  .rate .one { background: var(--card); color: var(--green); border: 2px solid var(--btn-bot); }
  .rate .two { background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); color: #fff; }
  .rate p { margin: 0; color: var(--ink-2); font-size: 1rem; line-height: 1.45; }
  .rate .small { font-size: 1.08rem; font-weight: 600; color: var(--ink); }
  /* 2026-11-27 (owner, for this page: link to our search term for downloads): step 1 opens App Store search for our name
     on iPhone, so the install counts as a search download; below it the App Store's live order for that search
     (data/live_listing.json, refreshed by the PC job) with our row outlined. */
  .rate .do { margin: 0; font-family: inherit; font-size: 1.55rem; line-height: 1.35; font-weight: 700; color: var(--ink); }
  .rate .spot { margin: 0; font-weight: 700; font-size: 1.1rem; color: var(--ink); }
  .rate .live { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
  #list li { display: grid; grid-template-columns: 2ch 44px 1fr; align-items: center; gap: 10px; padding: 7px 10px;
    border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  #list li.us { box-shadow: 0 0 0 3px var(--btn-bot); }
  #list li img { width: 44px; height: 44px; border-radius: 11px; }
  #list li .n { font-weight: 700; color: var(--ink-2); text-align: right; }
  #list li .t { min-width: 0; }
  #list li .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .98rem; }
  #list li .t span { font-size: .82rem; color: var(--ink-2); }
</style>
</head>
<body>
<main class="wrap rate">
  <h1 class="do">Tap below.<br>Find our orange icon.<br>Tap Get.</h1>
  <a class="btn one store-link" data-store="rate-install" href="https://apps.apple.com/us/app/id6813140105">1. Install DriveDrill</a>
  <p class="spot" id="spot" hidden></p>
  <ol class="live" id="list"></ol>
  <p class="do">Come back here.<br>Tap below.<br>Tap 5 stars, then Send.</p>
  <a class="btn two store-link" data-store="rate-review" href="https://apps.apple.com/us/app/id6813140105?action=write-review">2. Rate it</a>
  <p class="small">If Send stays grey, close that screen, scroll down the app's page and tap the 5th star under "Tap to Rate".</p>
  <p>Thank you!</p>
</main>
<script>
  // 2026-11-11 (owner: "can you just count the website clicks"): counts page visits and taps on the two buttons.
  // Only a number goes up at abacus.jasoncameron.dev (a free counter, no sign-up); nothing about the visitor is sent with the count.
  (function () {
    var base = "https://abacus.jasoncameron.dev/hit/dd-rate-dbc0c5c2/";
    function hit(key) { try { fetch(base + key, { mode: "no-cors", keepalive: true }); } catch (e) {} }
    // 2026-11-12 (owner: "I just want state data", "city would be great too"): each visit and tap is also logged with the
    // visitor's approximate city and state from get.geojs.io (their IP is looked up there and not kept by us), posted to an
    // ntfy.sh topic the tracker reads. Only event | city | state | country is sent; no IP, no ID.
    var geo = fetch("https://get.geojs.io/v1/ip/geo.json").then(function (r) { return r.json(); }).catch(function () { return {}; });
    function log(ev) {
      geo.then(function (g) {
        var line = [ev, g.city || "?", g.region || "?", g.country_code || "?"].join(" | ");
        try { fetch("https://ntfy.sh/dd-rate-geo-2673826459b2", { method: "POST", body: line, keepalive: true }); } catch (e) {}
      });
    }
    hit("visits"); log("visit");
    var one = document.querySelector('[data-store="rate-install"]');
    var two = document.querySelector('[data-store="rate-review"]');
    // 2026-11-24 (owner: "yes"): on iPhone and iPad the https link opened the normal store page; itms-apps opens Write a Review.
    // The https href stays as the fallback everywhere else. iPadOS can report "Macintosh", so touch points tell it apart.
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (two && ios) two.href = "itms-apps://apps.apple.com/app/id6813140105?action=write-review";
    // 2026-11-27: step 1 opens App Store search for our exact name (copied too, in case search opens empty)
    var TERM = "DMV Practice Test・2027";
    if (one && ios) one.href = "itms-apps://?action=search&q=" + encodeURIComponent(TERM);
    if (one) one.addEventListener("click", function () { try { navigator.clipboard.writeText(TERM); } catch (e) {} });
    function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
    fetch("/data/live_listing.json?" + Math.floor(Date.now() / 60000)).then(function (r) { return r.json(); }).then(function (d) {
      var s = d.name; if (!s) return;
      if (Date.now() - new Date(d.checkedAt).getTime() > 3 * 3600000) return; // no old list, no time shown
      var spot = document.getElementById("spot");
      if (s.ourPosition) { spot.textContent = "We're #" + s.ourPosition + " in the search"; spot.hidden = false; }
      var ol = document.getElementById("list");
      s.top.filter(function (a) { return a.pos <= 5 || a.us; }).forEach(function (a) {
        var li = el("li", a.us ? "us" : ""), img = el("img"); if (a.icon) img.src = a.icon; else img.style.visibility = "hidden"; img.alt = ""; img.width = 44; img.height = 44;
        var t = el("div", "t"); t.appendChild(el("b", "", a.name));
        t.appendChild(el("span", "", (a.us ? "DriveDrill · " : "") + (a.ratings ? a.ratings.toLocaleString() + " ratings" : "New")));
        li.appendChild(el("span", "n", String(a.pos))); li.appendChild(img); li.appendChild(t); ol.appendChild(li);
      });
    }).catch(function () {});
    if (one) one.addEventListener("click", function () { hit("install_taps"); log("install_tap"); });
    if (two) two.addEventListener("click", function () { hit("rate_taps"); log("rate_tap"); });
  })();
</script>
</body>
</html>
