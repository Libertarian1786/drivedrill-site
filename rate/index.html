<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Rate DriveDrill</title>
<meta name="description" content="Install DriveDrill, then rate it.">
<link rel="canonical" href="https://drivedrill.app/rate/">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#DCEBFA">
<link rel="stylesheet" href="/style.css">
<style>
  /* 2026-11-11 (owner: "a hidden webpage that has a QR code that does all these steps"): not linked from any page,
     not in the sitemap, noindex. Reached only by its QR code. */
  .rate { max-width: 28rem; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 14px; text-align: center; }
  .rate img.app { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); }
  .rate h1 { margin: 0; font: 700 1.9rem/1.2 var(--display); }
  .rate .btn { display: block; padding: 18px 20px; border-radius: 18px; font-weight: 700; font-size: 1.15rem; text-decoration: none; }
  .rate .one { background: var(--card); color: var(--green); border: 2px solid var(--btn-bot); }
  .rate .two { background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); color: #fff; }
  .rate p { margin: 0; color: var(--ink-2); font-size: 1rem; line-height: 1.45; }
  .rate .small { font-size: .92rem; }
</style>
</head>
<body>
<main class="wrap rate">
  <img class="app" src="/apple-touch-icon.png" alt="DriveDrill app icon" width="84" height="84">
  <h1>Rate DriveDrill</h1>
  <a class="btn one store-link" data-store="rate-install" href="https://apps.apple.com/us/app/id6813140105">1. Install DriveDrill</a>
  <p class="small">Tap Get. Apple only lets you rate apps you have downloaded. Then come back to this page.</p>
  <a class="btn two store-link" data-store="rate-review" href="https://apps.apple.com/us/app/id6813140105?action=write-review">2. Rate it</a>
  <p class="small">Tap the 5th star (★★★★★), then Send. If Send stays grey, close that screen, scroll down the app's page and tap the 5th star under "Tap to Rate".</p>
  <p>Thank you!</p>
</main>
<script>
  // 2026-11-11 (owner: "can you just count the website clicks"): counts page visits and taps on the two buttons.
  // Only a number goes up at abacus.jasoncameron.dev (a free counter, no sign-up); nothing about the visitor is sent with the count.
  (function () {
    var base = "https://abacus.jasoncameron.dev/hit/dd-rate-dbc0c5c2/";
    function hit(key) { try { fetch(base + key, { mode: "no-cors", keepalive: true }); } catch (e) {} }
    // 2026-11-12 (owner: "I just want state data", "city would be great too"): each visit and tap is also logged with the
    // visitor's approximate city and state from get.geojs.io (their IP is looked up there and not kept by us), posted to an
    // ntfy.sh topic the tracker reads. Only event | city | state | country is sent; no IP, no ID.
    var geo = fetch("https://get.geojs.io/v1/ip/geo.json").then(function (r) { return r.json(); }).catch(function () { return {}; });
    function log(ev) {
      geo.then(function (g) {
        var line = [ev, g.city || "?", g.region || "?", g.country_code || "?"].join(" | ");
        try { fetch("https://ntfy.sh/dd-rate-geo-2673826459b2", { method: "POST", body: line, keepalive: true }); } catch (e) {}
      });
    }
    hit("visits"); log("visit");
    var one = document.querySelector('[data-store="rate-install"]');
    var two = document.querySelector('[data-store="rate-review"]');
    if (one) one.addEventListener("click", function () { hit("install_taps"); log("install_tap"); });
    if (two) two.addEventListener("click", function () { hit("rate_taps"); log("rate_tap"); });
  })();
</script>
</body>
</html>
