<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Find DriveDrill in the App Store</title>
<meta name="description" content="Search the App Store for DMV Practice Test 2027 and get DriveDrill.">
<link rel="canonical" href="https://drivedrill.app/find/">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#DCEBFA">
<link rel="stylesheet" href="/style.css">
<style>
  /* 2026-11-27 (owner: "I want the page when fetched to pull the live listing", then "Ok do that" to a 15-minute update):
     hidden page, noindex, not in the sitemap. Shows the App Store's real search order for our name (data/live_listing.json,
     written every 15 minutes by the PC job), our spot highlighted, and a Get button that opens App Store search for our name
     so the download comes from a search. */
  .find { max-width: 30rem; margin: 0 auto; padding-block: 32px 56px; display: grid; gap: 14px; }
  .find h1 { margin: 0; font: 700 1.7rem/1.2 var(--display); text-align: center; }
  .find .term { text-align: center; font-size: 1.05rem; color: var(--ink-2); margin: 0; }
  .find .term b { color: var(--ink); }
  .find .spot { text-align: center; font-size: 1.2rem; font-weight: 700; margin: 0; }
  .find .btn { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 22px 18px; border-radius: 22px;
    font-weight: 800; font-size: 1.45rem; text-decoration: none; color: #fff; background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); }
  .find .btn img { width: 60px; height: 60px; border-radius: 14px; }
  .find .how { display: block; list-style: decimal; margin: 0; padding-left: 1.6em; font-size: 1.35rem; line-height: 1.5; font-weight: 700; }
  .find .how li { display: list-item; background: none; box-shadow: none; border: 0; border-radius: 0; padding: 2px 0; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #list li { display: grid; grid-template-columns: 2ch 48px 1fr; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  #list li.us { box-shadow: 0 0 0 3px var(--btn-bot); }
  #list li img { width: 48px; height: 48px; border-radius: 12px; }
  #list li .n { font-weight: 700; color: var(--ink-2); text-align: right; }
  #list li .t { min-width: 0; }
  #list li .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li .t span { font-size: .85rem; color: var(--ink-2); }
</style>
</head>
<body>
<main class="wrap find">
  <h1>Get DriveDrill</h1>
  <ol class="how">
    <li>Tap the green button.</li>
    <li>Find our orange DMV 2027 icon.</li>
    <li>Tap Get.</li>
  </ol>
  <p class="spot" id="spot" hidden></p>
  <a class="btn store-link" id="get" data-store="find-get" href="https://apps.apple.com/us/app/id6813140105"><img src="/apple-touch-icon.png" alt="" width="60" height="60">Open the App Store</a>
  <p class="term">It searches for <b id="term">DMV Practice Test・2027</b></p>
  <ol id="list"></ol>
</main>
<script>
  (function () {
    var KEY = "name", TERM = "DMV Practice Test・2027";
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var get = document.getElementById("get");
    // On iPhone and iPad the button opens App Store search with our name typed in (and copies it, in case the
    // App Store opens without it); elsewhere it stays the normal App Store link.
    if (ios) get.href = "itms-apps://?action=search&q=" + encodeURIComponent(TERM);
    get.addEventListener("click", function () { try { navigator.clipboard.writeText(TERM); } catch (e) {} });
    function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
    fetch("/data/live_listing.json?" + Math.floor(Date.now() / 60000)).then(function (r) { return r.json(); }).then(function (d) {
      var s = d[KEY]; if (!s) return;
      var spot = document.getElementById("spot");
      var w = new Date(d.checkedAt), old = Date.now() - w.getTime() > 3 * 3600000;
      if (old) return; // 11-27 David "people are going to time check this": no time shown; an old list is not shown at all
      if (s.ourPosition) { spot.textContent = "We're #" + s.ourPosition; spot.hidden = false; }
      var ol = document.getElementById("list");
      s.top.filter(function (a) { return a.pos <= 6 || a.us; }).forEach(function (a) {
        var li = el("li", a.us ? "us" : ""), img = el("img"); if (a.icon) img.src = a.icon; else img.style.visibility = "hidden"; img.alt = ""; img.width = 48; img.height = 48;
        var t = el("div", "t"); t.appendChild(el("b", "", a.name));
        t.appendChild(el("span", "", (a.us ? "DriveDrill · " : "") + (a.ratings ? a.ratings.toLocaleString() + " ratings" : "New")));
        li.appendChild(el("span", "n", String(a.pos))); li.appendChild(img); li.appendChild(t); ol.appendChild(li);
      });
    }).catch(function () {});
  })();
</script>
</body>
</html>
